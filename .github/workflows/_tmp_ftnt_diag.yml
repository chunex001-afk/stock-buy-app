name: TEMP diagnostic (read-only) - FORM priormean state

# 一時的な読み取り専用診断workflow(2026-10-28、FORM状態確認用。元はFTNT
# 調査用だったファイルを同じ目的〈読み取り専用〉で再利用している)。
# Redisへの書き込みは一切行わない(store.get_*とapp._build_watchlist_
# prior_means〈既存の表示用関数、無変更〉を呼ぶだけ)。確認が終わったら
# このworkflowファイル自体を削除する。既存のQ1〜Q5判定・BUY判定・
# 既存56銘柄・既存4workflowには一切関与しない。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read-only Redis state dump (no writes)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python - <<'PY'
          import redis_store as store
          import app

          TICKER = "FORM"

          watchlist = store.get_watchlist() or []
          print("watchlist:", watchlist)
          print(f"{TICKER} in watchlist:", TICKER in watchlist)

          status = store.get_priormean_backfill_status(TICKER)
          print(f"priormean:backfill_status:{TICKER} =", status)

          events = store.get_priormean_events(TICKER)
          print(f"priormean:events:{TICKER} count =", len(events) if events else 0)
          if events:
              print("  first:", events[0])
              print("  last :", events[-1])

          pending = store.get_priormean_pending_backfill()
          print("priormean:pending_backfill =", pending)

          bounds = store.get_priormean_bounds_history()
          if bounds:
              dates = sorted(bounds.keys())
              print("priormean:bounds_history count =", len(dates), "range =", dates[0], "~", dates[-1])
          else:
              print("priormean:bounds_history = None")

          # 本番と完全に同じ表示用関数(app._build_watchlist_prior_means、無変更)を
          # そのまま呼ぶ。prior_mean/prior_n/prior_median/win_rate/labelを本番と
          # 完全に同一の計算で取得する(新しい計算ロジックはここで作らない)。
          pool_history = store.get_pool_history()
          if pool_history and pool_history.get("dates"):
              anchor_date = sorted(pool_history["dates"])[-1]
              result = app._build_watchlist_prior_means([TICKER], anchor_date)
              print(f"_build_watchlist_prior_means([{TICKER!r}], {anchor_date!r}) =")
              print(" ", result[0])
          else:
              print("quintile:pool_history が未初期化のため、_build_watchlist_prior_meansは呼べません。")
          PY
