name: Daily stock data refresh

on:
  schedule:
    # UTC 22:00(前日) = JST 7:00(米国市場クローズ後、データ確定を待つ余裕を見た時刻)
    - cron: "0 22 * * *"
    # UTC 1:00 = JST 10:00(cron起動遅延・取りこぼし対策のリトライ枠)
    - cron: "0 1 * * *"
    # UTC 4:00 = JST 13:00(同上)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-10-23: AI市場下落状況パネル(design)がAI_UNIVERSE41銘柄を毎日
    # 逐次取得するようになり(+約7分)、既存処理との合計が10分を超える
    # リスクがあるため、q5-universe-refresh.ymlと同じ20分に変更した。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily refresh
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # 株価データ更新完了通知(design 2026-10-22)用。Renderに設定済みの
          # VAPID_PRIVATE_KEYと同じ値をGitHub Actions Secretsにも登録したもの。
          # 未設定(空文字)の場合はpush_notify.is_configured()がFalseになり、
          # 通知機能だけが無効化される(daily-refresh本体には影響しない)。
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: python refresh.py
