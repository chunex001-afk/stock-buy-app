name: TEMP diagnostic (read-only) - FORM adjust=all vs adjust=splits vs Yahoo

# 一時的な読み取り専用診断workflow(2026-10-28、Twelve Data adjust="all"が
# Yahoo基準のFORM Day0結果にどれだけ近づくかの検証用)。
#
# Redisへの書き込みは一切行わない(priormean:bounds_historyの読み取りのみ、
# priormean:events:FORM/priormean:backfill_status:FORMには一切触れない=
# 本番のFORM結果はそのまま維持される)。
# backfill_new_ticker_prior_mean.py / twelvedata_client.py / refresh.py /
# quintile_logic.py / q5_universe_logic.py は一切変更しない(importして
# 呼ぶだけ)。twelvedata_client.ADJUSTは_tmp_form_adjust_diag.py内で実行時
# にモジュール属性を一時的に上書きするだけで、ファイル自体は無変更。
#
# Twelve Data呼び出しは合計3回(SPY×1 + FORM×2〈splits/all〉)。
# 確認後、このworkflowファイル・スクリプト・一時データディレクトリは削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare FORM Day0 events across Yahoo / TD-splits / TD-all (read-only)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python _tmp_form_adjust_diag.py
