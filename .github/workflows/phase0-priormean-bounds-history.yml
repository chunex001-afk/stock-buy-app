name: Phase 0 (one-time) priormean bounds_history seed

# prior_mean差分更新の設計(2026-10-27研究・design確認済み)Phase 0専用、
# 一度だけ手動実行する一時workflow。REFERENCE_UNIVERSE(quintile_logic.py、
# 48銘柄+SPY、無変更)の過去の日次Q1〜Q5 bounds時系列を本番Upstash Redis
# (priormean:bounds_history、TTLなし)へ投入する。
#
# 既存の daily-refresh.yml / q5-universe-refresh.yml / priormean-
# incremental.yml / priormean-backfill.yml とは完全に分離した専用
# workflowで、これら既存4workflowの動作には一切影響しない。既存のQ1〜Q5
# 判定・BUY判定・既存56銘柄のq5_prior_mean_reference.jsonにも一切関与
# しない(build_priormean_bounds_history.py自体がこれらをimportして
# 呼ぶだけで変更しない)。
#
# ローカルにのみ存在する.q5_price_cache/.q5_score_cache(.gitignore対象、
# コミットしない)を、一時的なGitHub Release「phase0-cache-temp」の
# アセット(phase0_cache.tar.gz)経由でこのjobに取り込む。REFERENCE_
# UNIVERSE49銘柄分のみを含む(watchlist追加銘柄は含まない)。取得は
# 標準のGITHUB_TOKENで行う(追加のsecretは不要)。
#
# このworkflowはPhase 0完了・確認後に削除する前提の一時ファイル。

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: phase0-priormean-bounds-history
  cancel-in-progress: false

jobs:
  phase0-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download phase0 cache asset from temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download phase0-cache-temp \
            --repo "${{ github.repository }}" \
            --pattern phase0_cache.tar.gz

      - name: Extract cache (REFERENCE_UNIVERSE 49 tickers only)
        run: tar -xzf phase0_cache.tar.gz

      - name: Run Phase 0 bounds_history build (writes priormean:bounds_history only)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python build_priormean_bounds_history.py
