name: TEMP diagnostic (read-only + isolated lock probe) - AAPL / set_nx fix verification

# 一時的な診断workflow(2026-10-28、set_nx修正後の本番確認用)。
#
# priormean:backfill_status/events:AAPLの読み取りは完全に読み取り専用。
# push lockの確認だけは、本物のpush:dispatched_commit/notified_commit等
# には一切触れず、明確にテスト専用とわかる偽のcommit文字列
# ("TEST-SETNX-VERIFY-ONLY")でtry_acquire_push_dispatch_lockを1回だけ
# 呼び、TTL付きロックキーが正常に取得できることだけを確認する(実際の
# デプロイ通知・送信処理は一切呼ばない)。確認後にこのworkflowは削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify AAPL state (read-only) and set_nx fix (isolated probe)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python - <<'PY'
          import redis_store as store

          print("=== AAPL state (read-only) ===")
          status = store.get_priormean_backfill_status("AAPL")
          print("priormean:backfill_status:AAPL =", status)

          events = store.get_priormean_events("AAPL") or []
          print("priormean:events:AAPL count =", len(events))
          if events:
              sorted_events = sorted(events, key=lambda e: e["date"])
              print("  first:", sorted_events[0])
              print("  last :", sorted_events[-1])

          lock_raw = store.get("priormean:backfill_lock:AAPL")
          print("priormean:backfill_lock:AAPL (raw, TTL経過後はNoneになる) =", lock_raw)

          print()
          print("=== set_nx fix: isolated push-lock probe (本物のpush:dispatched_commit等には触れない) ===")
          probe_commit = "TEST-SETNX-VERIFY-ONLY"
          first = store.try_acquire_push_dispatch_lock(probe_commit)
          second = store.try_acquire_push_dispatch_lock(probe_commit)
          print("1回目の取得(新規key):", first, "(Trueが正しい)")
          print("2回目の取得(同じkey、取得済み):", second, "(Falseが正しい)")
          PY
